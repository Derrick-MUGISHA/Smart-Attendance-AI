version: '3.9'
services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  bot:
    build: .
    command: python -m app.bot.bot
    env_file:
      - .env
    depends_on:
      - api
      - redis

  worker-ocr:
    build: .
    command: celery -A app.tasks.celery_app worker -Q ocr -c 2
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  worker-validation:
    build: .
    command: celery -A app.tasks.celery_app worker -Q validation -c 4
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  worker-export:
    build: .
    command: celery -A app.tasks.celery_app worker -Q export -c 2
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  flower:
    build: .
    command: celery -A app.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
